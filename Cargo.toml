[workspace]
resolver = "2"
members = [
    "crates/monoloop-contracts",
    "crates/monoloop-connector",
    "crates/monoloop-connector-grok",
]
default-members = [
    "crates/monoloop-contracts",
    "crates/monoloop-connector",
    "crates/monoloop-connector-grok",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
bytes = "1.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
tracing = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.26"
url = "2.5"
http = "1.3"
base64 = "0.22"
