[workspace]
resolver = "2"
members = [
    "crates/monoloop-contracts",
    "crates/monoloop-connector",
    "crates/monoloop-connector-grok",
    "crates/monoloop-connector-cursor",
    "crates/monoloop-connector-agy",
    "crates/monoloop-connector-codex",
    "crates/monoloop-connector-zai",
    "crates/monoloop-connector-claude",
    "crates/monoloop-interpreter",
    "crates/monoloop-loop",
    "crates/monoloop-testkit",
    "crates/monoloop",
]
default-members = [
    "crates/monoloop-contracts",
    "crates/monoloop-connector",
    "crates/monoloop-connector-grok",
    "crates/monoloop-connector-cursor",
    "crates/monoloop-connector-agy",
    "crates/monoloop-connector-codex",
    "crates/monoloop-connector-zai",
    "crates/monoloop-connector-claude",
    "crates/monoloop-interpreter",
    "crates/monoloop-loop",
    "crates/monoloop-testkit",
    "crates/monoloop",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Alexander R. Croft"]
repository = "https://github.com/frogfishio/monoloop"
homepage = "https://frogfish.io"
readme = "README.md"
keywords = ["llm", "agent", "async", "tokio", "acp"]
categories = ["asynchronous", "api-bindings"]
# Raised to 1.88 in WP-00 for maintained `rmcp` Streamable HTTP SDK (see DECISIONS.md).
rust-version = "1.88"

[workspace.dependencies]
bytes = "1.10"
thiserror = "2.0"
tokio = { version = "1.44", features = ["macros", "rt-multi-thread", "sync", "time", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.16", features = ["v4", "serde"] }
tracing = "0.1"
futures-util = "0.3"
tokio-tungstenite = "0.26"
url = "2.5"
http = "1.3"
base64 = "0.22"
pulldown-cmark = "0.13"

# WP-00 qualified dependencies for TransactionRuntime (HTTP connector, MCP gateway,
# tool schema validation, secrets, CSPRNG). Feature sets pin Rustls and avoid
# default native-TLS / unwanted system linkage. See doc/WP00_BASELINE_EVIDENCE.md.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "stream", "http2"] }
rmcp = { version = "3.1.2", default-features = false, features = ["server", "macros", "transport-streamable-http-server"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tower = { version = "0.5", default-features = false }
jsonschema = { version = "0.49", default-features = false }
secrecy = { version = "0.10", features = ["serde"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
getrandom = "0.3"

# Internal crates (path + version required for crates.io publish).
monoloop-contracts = { path = "crates/monoloop-contracts", version = "0.1.2" }
monoloop-connector = { path = "crates/monoloop-connector", version = "0.1.2" }
monoloop-connector-grok = { path = "crates/monoloop-connector-grok", version = "0.1.2" }
monoloop-connector-cursor = { path = "crates/monoloop-connector-cursor", version = "0.1.2" }
monoloop-connector-agy = { path = "crates/monoloop-connector-agy", version = "0.1.2" }
monoloop-connector-codex = { path = "crates/monoloop-connector-codex", version = "0.1.2" }
monoloop-connector-zai = { path = "crates/monoloop-connector-zai", version = "0.1.2" }
monoloop-connector-claude = { path = "crates/monoloop-connector-claude", version = "0.1.2" }
monoloop-interpreter = { path = "crates/monoloop-interpreter", version = "0.1.2" }
monoloop-loop = { path = "crates/monoloop-loop", version = "0.1.2" }
monoloop-testkit = { path = "crates/monoloop-testkit", version = "0.1.2" }
