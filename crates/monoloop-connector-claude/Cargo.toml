[package]
name = "monoloop-connector-claude"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Claude Code CLI connector profile (headless stream-json NDJSON on stdout)"

[dependencies]
bytes = { workspace = true }
monoloop-connector = { path = "../monoloop-connector" }
monoloop-contracts = { path = "../monoloop-contracts" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "macros", "sync", "time", "rt-multi-thread"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
