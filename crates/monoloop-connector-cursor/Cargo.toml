[package]
name = "monoloop-connector-cursor"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Cursor Agent ACP connector profile (JSON-RPC over stdio NDJSON)"

[dependencies]
bytes = { workspace = true }
monoloop-connector = { path = "../monoloop-connector" }
monoloop-contracts = { path = "../monoloop-contracts" }
monoloop-interpreter = { path = "../monoloop-interpreter" }
monoloop-loop = { path = "../monoloop-loop" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs", "macros", "sync", "time", "rt-multi-thread"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "process", "io-util"] }
