[package]
name = "monoloop-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Test kit: console renderer, fixtures, and composition helpers (not a product component)"

[dependencies]
bytes = { workspace = true }
monoloop-contracts = { path = "../monoloop-contracts" }
monoloop-connector = { path = "../monoloop-connector" }
monoloop-connector-grok = { path = "../monoloop-connector-grok" }
monoloop-connector-cursor = { path = "../monoloop-connector-cursor" }
monoloop-connector-agy = { path = "../monoloop-connector-agy" }
monoloop-connector-codex = { path = "../monoloop-connector-codex" }
monoloop-connector-zai = { path = "../monoloop-connector-zai" }
monoloop-connector-claude = { path = "../monoloop-connector-claude" }
monoloop-interpreter = { path = "../monoloop-interpreter" }
monoloop-loop = { path = "../monoloop-loop" }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
http = { workspace = true }
