[package]
name = "monoloop-testkit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Test kit: console renderer, fixtures, and composition helpers (not a product component)"
# Explicit test targets so suites needing deleted v1 DefaultTransactionRuntime
# are gated during Runtime v2 migration (M7 cutover).
autotests = false

[features]
default = []
# Removed: do not reintroduce a feature that compiles deleted v1 symbols (D-038/M7).

[dependencies]
bytes = { workspace = true }
monoloop-contracts = { workspace = true }
monoloop-connector = { workspace = true }
monoloop-connector-grok = { workspace = true }
monoloop-connector-cursor = { workspace = true }
monoloop-connector-agy = { workspace = true }
monoloop-connector-codex = { workspace = true }
monoloop-connector-zai = { workspace = true }
monoloop-connector-claude = { workspace = true }
monoloop-interpreter = { workspace = true }
monoloop-loop = { workspace = true }
pulldown-cmark = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["process", "io-util", "fs"] }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "process"] }
futures-util = { workspace = true }
tokio-tungstenite = { workspace = true }
url = { workspace = true }
http = { workspace = true }

[[test]]
name = "console_pipeline"
path = "tests/console_pipeline.rs"

[[test]]
name = "driver_e2e"
path = "tests/driver_e2e.rs"

[[test]]
name = "html_dump"
path = "tests/html_dump.rs"

[[test]]
name = "profile_bindings"
path = "tests/profile_bindings.rs"

[[test]]
name = "qualification_projection"
path = "tests/qualification_projection.rs"

[[test]]
name = "raw_dump_pipeline"
path = "tests/raw_dump_pipeline.rs"

[[test]]
name = "canonical_event_presentation"
path = "tests/canonical_event_presentation.rs"
