[package]
name = "monoloop-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Minimal extensible Loop: lossless canonical subscription, empty-capable tools"

[dependencies]
monoloop-contracts = { path = "../monoloop-contracts" }
monoloop-connector = { path = "../monoloop-connector" }
monoloop-interpreter = { path = "../monoloop-interpreter" }
axum = { workspace = true }
jsonschema = { workspace = true }
rand = { workspace = true }
rmcp = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
reqwest = { workspace = true }

# WP-11 profile binding qualification
monoloop-connector-grok = { path = "../monoloop-connector-grok" }
monoloop-connector-cursor = { path = "../monoloop-connector-cursor" }
monoloop-connector-codex = { path = "../monoloop-connector-codex" }
monoloop-connector-agy = { path = "../monoloop-connector-agy" }
monoloop-connector-zai = { path = "../monoloop-connector-zai" }
monoloop-connector-claude = { path = "../monoloop-connector-claude" }
