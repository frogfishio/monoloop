[package]
name = "monoloop-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Minimal extensible Loop: lossless canonical subscription, empty-capable tools"

[dependencies]
monoloop-contracts = { path = "../monoloop-contracts" }
monoloop-connector = { path = "../monoloop-connector" }
monoloop-interpreter = { path = "../monoloop-interpreter" }
axum = { workspace = true }
jsonschema = { workspace = true }
rand = { workspace = true }
rmcp = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
reqwest = { workspace = true }
