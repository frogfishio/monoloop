[package]
name = "monoloop-loop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Minimal extensible Loop: lossless canonical subscription, empty-capable tools"
# Disable autodiscovery so legacy v1 integration tests are not built unless
# explicitly listed (and gated) below during Runtime v2 migration.
autotests = false
autoexamples = false

[dependencies]
monoloop-contracts = { workspace = true }
monoloop-connector = { workspace = true }
monoloop-interpreter = { workspace = true }
axum = { workspace = true }
futures-util = { workspace = true }
jsonschema = { workspace = true }
rand = { workspace = true }
rmcp = { workspace = true }
secrecy = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time", "net", "io-util", "process"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

[features]
default = []
# v1 integration suites under tests/{admission_lifecycle,exchange_e2e,…}.rs and
# examples/fake_echo.rs are kept on disk but not registered until rewritten for
# StartedRuntime (D-038 / M7). Do not reintroduce a feature that compiles deleted
# v1 symbols.

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread", "sync", "time", "net"] }
reqwest = { workspace = true }

[[test]]
name = "empty_loop"
path = "tests/empty_loop.rs"

[[test]]
name = "rmcp_loopback_spike"
path = "tests/rmcp_loopback_spike.rs"
